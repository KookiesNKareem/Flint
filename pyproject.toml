[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "flint_backend"
backend-path = ["tools"]

[project]
name = "flint"
version = "0.10.3"
description = "Checked GPU kernels for ordinary PyTorch functions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["torch>=2.8", "numpy", "python-dotenv", "requests", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
build = ["openai>=1", "anthropic"]
test = ["pytest>=7"]

[project.scripts]
flint = "flint.__main__:main"

[project.urls]
Repository = "https://github.com/KookiesNKareem/Flint"
Issues = "https://github.com/KookiesNKareem/Flint/issues"

[tool.setuptools.packages.find]
include = ["flint", "flint_gpu*", "muse_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["external", "KernelBench", "runs_public"]
