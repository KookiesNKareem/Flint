name: Flint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel from the source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install and exercise the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/flint-test"
          source "$RUNNER_TEMP/flint-test/bin/activate"
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl
          cp -R examples/quickstart "$RUNNER_TEMP/example"
          cd "$RUNNER_TEMP/example"
          flint --help
          python -c "import flint_gpu, muse_kernel; assert muse_kernel.fast is flint_gpu.fast"
          flint run --policy observe -- train.py
      - name: Run contract, runtime, and workbench tests
        run: |
          source "$RUNNER_TEMP/flint-test/bin/activate"
          python -m pip install pytest openai anthropic
          python -m pytest -q tests/package tests/kernel_contract tests/workbench
          python tools/verify_submission_evidence.py
